plugins {
    id "com.android.application"
}

android {
    namespace "com.forcefocus.app"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.forcefocus.app"
        minSdk 23
        targetSdk 35
        versionCode 30
        versionName "0.3.0-home"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
    }
}

// Reject partial checkouts instead of packaging a blank WebView.
tasks.register('verifyFrozenAssets') {
    doLast {
        def expected = new groovy.json.JsonSlurper().parse(rootProject.file('frozen-assets/manifest.json')).files
        expected.each { relative, hash ->
            def asset = file("src/main/assets/${relative}")
            if (!asset.isFile()) throw new GradleException("Missing frozen asset ${relative}. Run tools/restore_frozen_assets.py with the original APK or image ZIP.")
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString()
            if (actual != hash) throw new GradleException("Frozen asset changed: ${relative}")
        }
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) task.dependsOn('verifyFrozenAssets')
}
